<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banglen't</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="./images/pwa-icon-256.png" />
    <meta name="theme-color" content="white" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body class="fullscreen">
    <header class="app-header">
      <h1>Banglen't</h1>
      <div class="status-indicators">
        <span id="network-status" class="status online">Conectado</span>
        <span id="save-status" class="status saved">Guardado</span>
      </div>
    </header>

    <main class="app-container">
      <aside class="sidebar" id="sidebar">
        <button id="btn-new-note">+ Nueva Nota</button>
        <ul id="note-list">
          <li class="active">Nota de ejemplo</li>
        </ul>
      </aside>

      <section class="workspace">
        <div class="editor-pane">
          <textarea
            id="markdown-input"
            placeholder="Escribe tu nota en Markdown aquí..."
          ></textarea>
        </div>
        <div class="preview-pane">
          <div id="markdown-preview" class="markdown-body"></div>
        </div>
      </section>
    </main>
    <script src="./js/app.js"></script>
  </body>
</html>
